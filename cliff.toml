# Changelog generation for Actus.
# Commits are grouped from Conventional Commit types and scopes.

[changelog]
header = """
# Changelog

All notable Actus changes are documented in this file.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute=\"group\") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{% if commit.breaking %}Breaking: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs\\(release\\): update changelog", skip = true },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^ci|^build|^chore", group = "<!-- 7 -->CI and Maintenance" },
    { body = ".*security.*", group = "<!-- 8 -->Security" },
    { message = "^revert", group = "<!-- 9 -->Reverts" },
    { message = ".*", group = "<!-- 10 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
