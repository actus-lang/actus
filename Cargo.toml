[package]
name = "actus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["cranelift"]
cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-object",
]
llvm = ["dep:llvm-sys"]

[dependencies]
ctrlc = "3.4.6"
cranelift-codegen = { version = "0.136.2", optional = true }
cranelift-frontend = { version = "0.136.2", optional = true }
cranelift-module = { version = "0.136.2", optional = true }
cranelift-object = { version = "0.136.2", optional = true }
llvm-sys = { version = "231.0.0", optional = true, features = ["strict-versioning"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
target-lexicon = "0.13.5"
toml = "0.9.8"

[dev-dependencies]
object = "0.40.0"

[[bench]]
name = "frontend"
harness = false

[[bench]]
name = "region"
harness = false
