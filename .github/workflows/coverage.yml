name: Coverage

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up LLVM 23
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Export LLVM build environment
        shell: bash
        run: |
          LLVM_CONFIG_PATH="$(command -v llvm-config)"
          LLVM_PREFIX="$(llvm-config --prefix)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "LLVM version: $(llvm-config --version)"
          test "$(llvm-config --version | cut -d. -f1)" = "23"

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate LCOV report
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: actus-coverage
          path: lcov.info
          if-no-files-found: error
