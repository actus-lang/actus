name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'MSVC installation was not found'
          }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $environment = & cmd.exe /c "call `"$devcmd`" -arch=x64 -host_arch=x64 && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $vcToolsRoot = Join-Path $installation 'VC\Tools\MSVC'
          $vcToolset = Get-ChildItem -Path $vcToolsRoot -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\Hostx64\x64\link.exe') } |
            Select-Object -First 1
          if (-not $vcToolset) {
            throw "An x64 MSVC toolset was not found under $vcToolsRoot"
          }
          $vcLinkDirectory = Join-Path $vcToolset.FullName 'bin\Hostx64\x64'
          $msvcLinker = Join-Path $vcLinkDirectory 'link.exe'
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ACTUS_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:Path = "$vcLinkDirectory;$env:Path"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if (-not $linker.StartsWith($vcLinkDirectory, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "MSVC linker was not selected: $linker"
          }

      - name: Set up LLVM 23 (Unix)
        if: runner.os != 'Windows'
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 23

      - name: Set up LLVM 23.1.2 development archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '23.1.2'
          $archiveName = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095'
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "LLVM archive checksum mismatch: expected $expected, got $actual"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "llvm-$version"
          New-Item -ItemType Directory -Force $installRoot | Out-Null
          tar -xf $archive -C $installRoot --strip-components=1
          $bin = Join-Path $installRoot 'bin'
          if (-not (Test-Path (Join-Path $bin 'llvm-config.exe'))) {
            throw "LLVM development archive does not contain llvm-config.exe"
          }
          $realConfig = Join-Path $bin 'llvm-config-real.exe'
          Move-Item (Join-Path $bin 'llvm-config.exe') $realConfig
          $wrapper = Join-Path $bin 'llvm-config.exe'
          $wrapperSource = @"
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Linq;
          using System.Text.RegularExpressions;
          internal static class Program {
            public static int Main(string[] args) {
              var start = new ProcessStartInfo {
                FileName = @"$realConfig",
                UseShellExecute = false,
                RedirectStandardOutput = true,
                RedirectStandardError = true,
                CreateNoWindow = true
              };
              start.Arguments = string.Join(" ", args.Select(arg => "\"" + arg.Replace("\"", "\\\"") + "\""));
              using (var process = Process.Start(start)) {
                var stdout = process.StandardOutput.ReadToEnd();
                var stderr = process.StandardError.ReadToEnd();
                process.WaitForExit();
                if (Array.IndexOf(args, "--system-libs") >= 0 && Array.IndexOf(args, "--link-static") >= 0) {
                  // The official Windows archive does not ship the optional zlib/XML2/Zstd import libraries.
                  stdout = Regex.Replace(stdout, @"(?i)(?:[A-Za-z]:[/\\][^\s]*[/\\])?(?:lib)?(?:zs?|zstd_static|xml2s?)\.lib", "");
                  stdout = Regex.Replace(stdout, @"(?i)[A-Za-z]:[/\\][^\s]*[/\\][^/\\\s]+\.lib", match => Path.GetFileName(match.Value));
                }
                Console.Write(stdout);
                Console.Error.Write(stderr);
                return process.ExitCode;
              }
            }
          }
          "@
          $wrapperSourcePath = Join-Path $env:RUNNER_TEMP 'llvm-config-wrapper.cs'
          Set-Content -Path $wrapperSourcePath -Value $wrapperSource -Encoding utf8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) {
            $csc = (Get-Command csc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $csc) {
            throw 'C# compiler is required to build the llvm-config wrapper'
          }
          & $csc /nologo /target:exe /out:$wrapper $wrapperSourcePath
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-config wrapper compilation failed with exit code $LASTEXITCODE"
          }
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LLVM_PATH=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export LLVM build environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          LLVM_CONFIG_PATH="$(command -v llvm-config)"
          LLVM_PREFIX="$(llvm-config --prefix)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "LLVM version: $(llvm-config --version)"
          test "$(llvm-config --version | cut -d. -f1)" = "23"

      - name: Export LLVM build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmConfig = (Get-Command llvm-config.exe -ErrorAction Stop).Source
          $llvmPrefix = (& $llvmConfig --prefix).Trim()
          "LLVM_CONFIG_PATH=$llvmConfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLVM_SYS_231_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          $llvmVersion = (& $llvmConfig --version).Trim()
          Write-Host "LLVM version: $llvmVersion"
          Write-Host "LLVM static libraries:"
          & $llvmConfig --libnames --link-static
          Write-Host "LLVM static system libraries:"
          & $llvmConfig --system-libs --link-static
          if (-not $llvmVersion.StartsWith('23.')) { throw "LLVM 23 is required" }

      - name: Install ARM32 native link tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Run LSP contract suite
        run: cargo test --test lsp --all-features -- --test-threads=1

      - name: Run Region native gate
        run: cargo test --test std_region_native --all-features -- --test-threads=1

      - name: Record Region cross-target evidence
        shell: bash
        run: |
          {
            echo "## Region native gate evidence (${RUNNER_OS})"
            echo "- cargo test --test std_region_native --all-features -- --test-threads=1 passed"
            echo "- hosted native Region fixtures and freestanding object fixtures passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record LSP platform evidence
        shell: bash
        run: |
          {
            echo "## LSP contract evidence (${RUNNER_OS})"
            echo "- cargo test --test lsp --all-features -- --test-threads=1 passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check source limits
        if: runner.os != 'Windows'
        run: ./scripts/check_source_limits.sh

      - name: Scan tracked files for secrets
        if: runner.os != 'Windows'
        run: ./scripts/check_secrets.sh

      - name: Check standard library conformance
        shell: bash
        run: ./scripts/check_stdlib.sh

  cranelift-only:
    name: Cranelift-only feature contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check compilation without LLVM
        run: cargo check --no-default-features --features cranelift --all-targets

      - name: Run Cranelift-only tests
        run: cargo test --no-default-features --features cranelift --all-targets -- --test-threads=1

  llvm-only:
    name: LLVM-only feature contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up LLVM 23
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 23

      - name: Install ARM32 native link tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Verify native link tools
        shell: bash
        run: |
          RUST_BIN="$(dirname "$(rustc --print target-libdir)")/bin"
          echo "$RUST_BIN" >> "$GITHUB_PATH"
          export PATH="$RUST_BIN:$PATH"
          command -v clang
          command -v arm-none-eabi-ld

      - name: Export LLVM build environment
        shell: bash
        run: |
          LLVM_CONFIG_PATH="$(command -v llvm-config)"
          LLVM_PREFIX="$(llvm-config --prefix)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"

      - name: Verify LLVM installation
        shell: bash
        run: |
          llvm-config --version
          test "$(llvm-config --version | cut -d. -f1)" = "23"

      - name: Check LLVM compiler surface
        run: cargo check --no-default-features --features llvm --lib --bin actus

      - name: Run LLVM backend integration suite
        run: cargo test --no-default-features --features llvm --test llvm_backend -- --test-threads=1

  arm32-target:
    name: ARM32 Thumb LLVM target contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up LLVM 23
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0
        with:
          llvm-version: 23

      - name: Install ARM32 target toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Export LLVM build environment
        shell: bash
        run: |
          LLVM_CONFIG_PATH="$(command -v llvm-config)"
          LLVM_PREFIX="$(llvm-config --prefix)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"

      - name: Verify target toolchain
        shell: bash
        run: |
          RUST_BIN="$(dirname "$(rustc --print target-libdir)")/bin"
          echo "$RUST_BIN" >> "$GITHUB_PATH"
          export PATH="$RUST_BIN:$PATH"
          llvm-config --version
          test "$(llvm-config --version | cut -d. -f1)" = "23"
          command -v clang
          command -v arm-none-eabi-ld
          arm-none-eabi-gcc --version
          arm-none-eabi-objdump --version

      - name: Run target contract tests
        run: cargo test --all-features --test target -- --test-threads=1

      - name: Run ARM32 LLVM object and link tests
        run: cargo test --no-default-features --features llvm --test llvm_backend -- --test-threads=1
