name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'MSVC installation was not found'
          }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $environment = & cmd.exe /c "call `"$devcmd`" -arch=x64 -host_arch=x64 && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Check source limits
        if: runner.os != 'Windows'
        run: ./scripts/check_source_limits.sh

      - name: Scan tracked files for secrets
        if: runner.os != 'Windows'
        run: ./scripts/check_secrets.sh
