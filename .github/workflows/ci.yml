name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'MSVC installation was not found'
          }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $environment = & cmd.exe /c "call `"$devcmd`" -arch=x64 -host_arch=x64 && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $vcToolsRoot = Join-Path $installation 'VC\Tools\MSVC'
          $vcToolset = Get-ChildItem -Path $vcToolsRoot -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\Hostx64\x64\link.exe') } |
            Select-Object -First 1
          if (-not $vcToolset) {
            throw "An x64 MSVC toolset was not found under $vcToolsRoot"
          }
          $vcLinkDirectory = Join-Path $vcToolset.FullName 'bin\Hostx64\x64'
          $msvcLinker = Join-Path $vcLinkDirectory 'link.exe'
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:Path = "$vcLinkDirectory;$env:Path"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if (-not $linker.StartsWith($vcLinkDirectory, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "MSVC linker was not selected: $linker"
          }

      - name: Prepare LLVM archive cache key (Unix)
        if: runner.os != 'Windows'
        id: llvm_archive_unix
        shell: bash
        run: |
          set -euo pipefail
          triple="$(python3 - <<'PY'
          import platform
          if platform.system() == "Linux" and platform.machine() == "x86_64": print("x86_64-unknown-linux-gnu")
          elif platform.system() == "Darwin" and platform.machine() == "arm64": print("aarch64-apple-darwin")
          else: raise SystemExit("unsupported LLVM CI host")
          PY
          )"
          read -r file sha < <(python3 - "$GITHUB_WORKSPACE/toolchains/llvm/llvm-23.1.2.json" "$triple" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))["archives"][sys.argv[2]]
          print(record["file"], record["sha256"])
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ACTUS_LLVM_ARCHIVE_CACHE=$RUNNER_TEMP/actus-llvm-archive/$file" >> "$GITHUB_ENV"

      - name: Prepare LLVM archive cache key (Windows)
        if: runner.os == 'Windows'
        id: llvm_archive_windows
        shell: pwsh
        run: |
          $record = (Get-Content -Raw 'toolchains/llvm/llvm-23.1.2.json' | ConvertFrom-Json).archives.'x86_64-pc-windows-msvc'
          "sha=$($record.sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ACTUS_LLVM_ARCHIVE_CACHE=$env:RUNNER_TEMP/actus-llvm-archive/$($record.file)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore LLVM archive cache (Unix)
        if: runner.os != 'Windows'
        id: llvm_archive_cache_unix
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_unix.outputs.sha }}

      - name: Restore LLVM archive cache (Windows)
        if: runner.os == 'Windows'
        id: llvm_archive_cache_windows
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_windows.outputs.sha }}

      - name: Bootstrap verified LLVM (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bootstrap_llvm.sh

      - name: Bootstrap verified LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap_llvm.ps1

      - name: Save LLVM archive cache (Unix)
        if: success() && runner.os != 'Windows' && steps.llvm_archive_cache_unix.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_unix.outputs.sha }}

      - name: Save LLVM archive cache (Windows)
        if: success() && runner.os == 'Windows' && steps.llvm_archive_cache_windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_windows.outputs.sha }}

      - name: Export LLVM build environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG_PATH=$prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          test "$("$prefix/bin/llvm-config" --version)" = 23.1.2

      - name: Export LLVM build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE '.actus-toolchain\llvm-23.1.2'
          $config = Join-Path $prefix 'bin\llvm-config.exe'
          $version = (& $config --version).Trim()
          if ($version -ne '23.1.2') { throw "expected LLVM 23.1.2, found $version" }
          "$prefix\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "LLVM_CONFIG_PATH=$config" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LLVM_SYS_231_PREFIX=$prefix" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $linker = Join-Path $prefix 'bin\lld-link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "bundled Windows COFF linker is missing: $linker"
          }
          "ACTUS_LINKER=$linker" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ARM32 native link tools (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 update
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends --yes clang binutils-arm-none-eabi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Run LLVM bridge and ABI contracts
        run: cargo test --test llvm_backend --all-features -- --test-threads=1

      - name: Run LSP contract suite
        run: cargo test --test lsp --all-features -- --test-threads=1

      - name: Run Region native gate
        run: cargo test --test std_region_native --all-features -- --test-threads=1

      - name: Assert static LLVM linkage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --all-features --bin actus
          ldd target/debug/actus | tee /tmp/actus-ldd.txt
          if grep -Eiq 'libLLVM' /tmp/actus-ldd.txt; then
            echo 'Actus unexpectedly links to a shared LLVM library' >&2
            exit 1
          fi

      - name: Assert static LLVM linkage (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --all-features --bin actus
          otool -L target/debug/actus | tee /tmp/actus-otool.txt
          if grep -Eiq 'libLLVM' /tmp/actus-otool.txt; then
            echo 'Actus unexpectedly links to a shared LLVM library' >&2
            exit 1
          fi

      - name: Assert static LLVM linkage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --all-features --bin actus
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target\debug\actus.exe'
          $dependencies = & dumpbin.exe /dependents $binary 2>&1
          $dependencies | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'actus-dependents.txt')
          if ($dependencies -match '(?i)libLLVM') {
            throw 'Actus unexpectedly links to a shared LLVM library'
          }

      - name: Record Region cross-target evidence
        shell: bash
        run: |
          {
            echo "## Region native gate evidence (${RUNNER_OS})"
            echo "- cargo test --test std_region_native --all-features -- --test-threads=1 passed"
            echo "- hosted native Region fixtures and freestanding object fixtures passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record LSP platform evidence
        shell: bash
        run: |
          {
            echo "## LSP contract evidence (${RUNNER_OS})"
            echo "- cargo test --test lsp --all-features -- --test-threads=1 passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check source limits
        if: runner.os != 'Windows'
        run: ./scripts/check_source_limits.sh

      - name: Scan tracked files for secrets
        if: runner.os != 'Windows'
        run: ./scripts/check_secrets.sh

      - name: Check standard library conformance
        shell: bash
        run: ./scripts/check_stdlib.sh

      - name: Run coordinated publication capability fixture
        shell: bash
        run: cargo run --features test-fault-injection --bin actus -- test --file tests/library/fs/publication_coordinator.act --strict

      - name: Record disk and target usage (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "## Disk and target usage (${RUNNER_OS})"
            df -h
            if [ -d target ]; then du -sh target; else echo 'target/ not present'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record disk and target usage (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          "## Disk and target usage (Windows)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-PSDrive -PSProvider FileSystem | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path target) {
            $bytes = (Get-ChildItem target -Recurse -File | Measure-Object Length -Sum).Sum
            "target bytes: $bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            'target/ not present' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  cranelift-only:
    name: Cranelift-only feature contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check compilation without LLVM
        run: cargo check --no-default-features --features cranelift --all-targets

      - name: Run Cranelift-only tests
        run: cargo test --no-default-features --features cranelift --all-targets -- --test-threads=1

  llvm-only:
    name: LLVM-only feature contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare LLVM archive cache key
        id: llvm_archive
        shell: bash
        run: |
          set -euo pipefail
          read -r file sha < <(python3 - 'toolchains/llvm/llvm-23.1.2.json' <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))['archives']['x86_64-unknown-linux-gnu']
          print(record['file'], record['sha256'])
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ACTUS_LLVM_ARCHIVE_CACHE=$RUNNER_TEMP/actus-llvm-archive/$file" >> "$GITHUB_ENV"

      - name: Restore LLVM archive cache
        id: llvm_archive_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive.outputs.sha }}

      - name: Bootstrap verified LLVM
        shell: bash
        run: ./scripts/bootstrap_llvm.sh

      - name: Save LLVM archive cache
        if: success() && steps.llvm_archive_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive.outputs.sha }}

      - name: Export LLVM build environment
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2"
          echo "LLVM_CONFIG_PATH=$prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          test "$("$prefix/bin/llvm-config" --version)" = 23.1.2

      - name: Prove LLVM tests do not depend on PATH
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2/bin/"
          paths="$(command -v llc llvm-objdump llvm-readobj ld.lld clang || true)"
          printf '%s\n' "$paths"
          if grep -F "$prefix" <<<"$paths"; then
            echo 'LLVM tool lookup unexpectedly uses the bundled prefix through PATH' >&2
            exit 1
          fi
          echo 'clang and ARM link tools may remain system-provided until T6.'

      - name: Install ARM32 native link tools
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 update
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends --yes clang binutils-arm-none-eabi

      - name: Verify native link tools
        shell: bash
        run: |
          RUST_BIN="$(dirname "$(rustc --print target-libdir)")/bin"
          echo "$RUST_BIN" >> "$GITHUB_PATH"
          export PATH="$RUST_BIN:$PATH"
          command -v clang
          command -v arm-none-eabi-ld

      - name: Verify LLVM installation
        shell: bash
        run: |
          llvm-config --version
          test "$(llvm-config --version)" = "23.1.2"

      - name: Check LLVM compiler surface
        run: cargo check --no-default-features --features llvm --lib --bin actus

      - name: Run LLVM backend integration suite
        run: cargo test --no-default-features --features llvm --test llvm_backend -- --test-threads=1

      - name: Record disk and target usage
        if: always()
        shell: bash
        run: |
          {
            echo '## Disk and target usage (LLVM-only)'
            df -h
            if [ -d target ]; then du -sh target; else echo 'target/ not present'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  arm32-target:
    name: ARM32 Thumb LLVM target contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare LLVM archive cache key
        id: llvm_archive
        shell: bash
        run: |
          set -euo pipefail
          read -r file sha < <(python3 - 'toolchains/llvm/llvm-23.1.2.json' <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))['archives']['x86_64-unknown-linux-gnu']
          print(record['file'], record['sha256'])
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ACTUS_LLVM_ARCHIVE_CACHE=$RUNNER_TEMP/actus-llvm-archive/$file" >> "$GITHUB_ENV"

      - name: Restore LLVM archive cache
        id: llvm_archive_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive.outputs.sha }}

      - name: Bootstrap verified LLVM
        shell: bash
        run: ./scripts/bootstrap_llvm.sh

      - name: Save LLVM archive cache
        if: success() && steps.llvm_archive_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive.outputs.sha }}

      - name: Export LLVM build environment
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG_PATH=$prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          test "$("$prefix/bin/llvm-config" --version)" = 23.1.2

      - name: Install ARM32 target toolchain
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 update
          sudo env DEBIAN_FRONTEND="$DEBIAN_FRONTEND" apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends --yes clang binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Verify target toolchain
        shell: bash
        run: |
          RUST_BIN="$(dirname "$(rustc --print target-libdir)")/bin"
          echo "$RUST_BIN" >> "$GITHUB_PATH"
          export PATH="$RUST_BIN:$PATH"
          llvm-config --version
          test "$(llvm-config --version)" = "23.1.2"
          command -v clang
          command -v arm-none-eabi-ld
          arm-none-eabi-gcc --version
          arm-none-eabi-objdump --version

      - name: Run target contract tests
        run: cargo test --all-features --test target -- --test-threads=1

      - name: Run ARM32 LLVM object and link tests
        run: cargo test --no-default-features --features llvm --test llvm_backend -- --test-threads=1

      - name: Record disk and target usage
        if: always()
        shell: bash
        run: |
          {
            echo '## Disk and target usage (ARM32 Thumb)'
            df -h
            if [ -d target ]; then du -sh target; else echo 'target/ not present'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  contributor-bootstrap:
    name: Contributor bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare LLVM archive cache key (Unix)
        if: runner.os != 'Windows'
        id: llvm_archive_unix
        shell: bash
        run: |
          set -euo pipefail
          triple="$(python3 - <<'PY'
          import platform
          system = platform.system()
          machine = platform.machine()
          if system == "Linux" and machine == "x86_64":
              print("x86_64-unknown-linux-gnu")
          elif system == "Darwin" and machine == "arm64":
              print("aarch64-apple-darwin")
          else:
              raise SystemExit(f"unsupported contributor host: {system}/{machine}")
          PY
          )"
          read -r archive_name archive_sha256 < <(python3 - "$GITHUB_WORKSPACE/toolchains/llvm/llvm-23.1.2.json" "$triple" <<'PY'
          import json
          import sys
          from pathlib import Path
          record = json.loads(Path(sys.argv[1]).read_text())['archives'][sys.argv[2]]
          print(record['file'], record['sha256'])
          PY
          )
          cache_path="$RUNNER_TEMP/actus-llvm-archive/$archive_name"
          echo "sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "ACTUS_LLVM_ARCHIVE_CACHE=$cache_path" >> "$GITHUB_ENV"

      - name: Prepare LLVM archive cache key (Windows)
        if: runner.os == 'Windows'
        id: llvm_archive_windows
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath 'toolchains/llvm/llvm-23.1.2.json' | ConvertFrom-Json
          $record = $manifest.archives.'x86_64-pc-windows-msvc'
          $cachePath = Join-Path $env:RUNNER_TEMP ("actus-llvm-archive\" + $record.file)
          "sha256=$($record.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ACTUS_LLVM_ARCHIVE_CACHE=$cachePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore LLVM archive cache (Unix)
        if: runner.os != 'Windows'
        id: llvm_archive_cache_unix
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_unix.outputs.sha256 }}

      - name: Restore LLVM archive cache (Windows)
        if: runner.os == 'Windows'
        id: llvm_archive_cache_windows
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_windows.outputs.sha256 }}

      - name: Bootstrap verified LLVM (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bootstrap_llvm.sh

      - name: Bootstrap verified LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap_llvm.ps1

      - name: Save LLVM archive cache (Unix)
        if: success() && runner.os != 'Windows' && steps.llvm_archive_cache_unix.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_unix.outputs.sha256 }}

      - name: Save LLVM archive cache (Windows)
        if: success() && runner.os == 'Windows' && steps.llvm_archive_cache_windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/actus-llvm-archive
          key: llvm-archive-${{ steps.llvm_archive_windows.outputs.sha256 }}

      - name: Prove Cargo uses the bundled LLVM (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"
          selected="$(realpath "$(command -v llvm-config)")"
          expected="$(realpath "$prefix/bin/llvm-config")"
          test "$selected" = "$expected"
          llvm-config --version

      - name: Prove Cargo uses the bundled LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE '.actus-toolchain\llvm-23.1.2'
          $llvmConfig = Join-Path $prefix 'bin\llvm-config.exe'
          if (-not (Test-Path -LiteralPath $llvmConfig -PathType Leaf)) {
            throw "bundled llvm-config.exe is missing: $llvmConfig"
          }
          $env:LLVM_SYS_231_PREFIX = $prefix
          "LLVM_SYS_231_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = (& $llvmConfig --version).Trim()
          if ($version -ne '23.1.2') {
            throw "bundled llvm-config version mismatch: expected 23.1.2, found $version"
          }
          Write-Host "Cargo LLVM prefix: $env:LLVM_SYS_231_PREFIX"
          Write-Host "Bundled llvm-config: $llvmConfig ($version)"

      - name: Reject a corrupted manifest before extraction (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          temporary_manifest="$RUNNER_TEMP/llvm-corrupt.json"
          python3 - "$GITHUB_WORKSPACE/toolchains/llvm/llvm-23.1.2.json" "$temporary_manifest" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          import platform
          triple = "x86_64-unknown-linux-gnu" if platform.system() == "Linux" else "aarch64-apple-darwin"
          manifest["archives"][triple]["sha256"] = "0" * 64
          Path(sys.argv[2]).write_text(json.dumps(manifest))
          PY
          corrupt_cache="$RUNNER_TEMP/llvm-corrupt-cache/archive"
          if ACTUS_LLVM_ARCHIVE_CACHE="$corrupt_cache" ./scripts/bootstrap_llvm.sh --manifest "$temporary_manifest" --install-root "$RUNNER_TEMP/llvm-corrupt"; then
            echo 'corrupted manifest unexpectedly succeeded' >&2
            exit 1
          fi
          test ! -e "$corrupt_cache"

      - name: Reject a corrupted manifest before extraction (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temporaryManifest = Join-Path $env:RUNNER_TEMP 'llvm-corrupt.json'
          $corruptCache = Join-Path $env:RUNNER_TEMP 'llvm-corrupt-cache\archive'
          $manifest = Get-Content -Raw -LiteralPath 'toolchains/llvm/llvm-23.1.2.json' | ConvertFrom-Json
          $manifest.archives.'x86_64-pc-windows-msvc'.sha256 = '0' * 64
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $temporaryManifest
          try {
            $env:ACTUS_LLVM_ARCHIVE_CACHE = $corruptCache
            & ./scripts/bootstrap_llvm.ps1 -ManifestPath $temporaryManifest -InstallRoot (Join-Path $env:RUNNER_TEMP 'llvm-corrupt')
            throw 'corrupted manifest unexpectedly succeeded'
          } catch {
            if ($_.Exception.Message -notmatch 'SHA-256 mismatch') { throw }
          }
          if (Test-Path -LiteralPath $corruptCache) { throw 'corrupted archive entered the cache' }
          Remove-Item Env:ACTUS_LLVM_ARCHIVE_CACHE -ErrorAction SilentlyContinue

      - name: Prove idempotent bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bootstrap_llvm.sh --offline

      - name: Prove idempotent bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap_llvm.ps1 -Offline

      - name: Check contributor build surface
        run: cargo check --all-targets --all-features

      - name: Verify bundled LLVM identity (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          identity="$(cargo run --quiet --bin actus -- --version --json)"
          printf '%s\n' "$identity"
          IDENTITY="$identity" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(os.environ["IDENTITY"])
          expected_manifest = json.loads(
              Path("toolchains/llvm/llvm-23.1.2.json").read_text()
          )
          import platform
          triple = (
              "x86_64-unknown-linux-gnu"
              if platform.system() == "Linux"
              else "aarch64-apple-darwin"
          )
          expected = expected_manifest["archives"][triple]
          assert actual["llvm"]["version"] == "23.1.2"
          assert actual["llvm"]["status"] == "verified"
          assert actual["llvm"]["archive_sha256"] == expected["sha256"]
          assert actual["llvm"]["release_tag"] == expected_manifest["release_tag"]
          PY

      - name: Verify bundled LLVM identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $identity = & cargo run --quiet --bin actus -- --version --json | ConvertFrom-Json
          $manifest = Get-Content -Raw -LiteralPath 'toolchains/llvm/llvm-23.1.2.json' | ConvertFrom-Json
          $expected = $manifest.archives.'x86_64-pc-windows-msvc'
          if ($identity.llvm.version -ne '23.1.2') { throw 'LLVM version identity mismatch' }
          if ($identity.llvm.status -ne 'verified') { throw 'LLVM identity is not verified' }
          if ($identity.llvm.archive_sha256 -ne $expected.sha256) { throw 'LLVM archive identity mismatch' }
          if ($identity.llvm.release_tag -ne $manifest.release_tag) { throw 'LLVM release identity mismatch' }

      - name: Run LLVM backend tests
        # These ARM32 link tests require system clang/arm-none-eabi; the ARM32 Thumb job covers them.
        # They return here after T6 when bundled lld is available.
        run: cargo test --test llvm_backend --all-features -- --test-threads=1 --skip links_a_minimal_arm32_thumb_image_with_explicit_startup_and_provider --skip links_an_explicit_external_c_provider_through_the_llvm_arm_path
