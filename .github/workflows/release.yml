name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "scripts/llvm/package_archive.py"

jobs:
  build-linux:
    name: Build user archive (Linux x86-64)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Bootstrap bundled LLVM
        shell: bash
        run: scripts/bootstrap_llvm.sh
      - name: Build ARM verification startup object
        shell: bash
        run: |
          mkdir -p release-support
          .actus-toolchain/llvm-23.1.2/bin/llc -mtriple=thumbv7em-none-eabihf -mcpu=cortex-m7 -filetype=obj scripts/release/user_archive_startup.ll -o release-support/startup.o
      - name: Build and package
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "2"
        run: |
          set -euo pipefail
          static_cxx="$RUNNER_TEMP/static-cxx"
          mkdir -p "$static_cxx"
          static_cxx_archive="$(gcc -print-file-name=libstdc++.a)"
          echo "$static_cxx_archive"
          if [ ! -f "$static_cxx_archive" ]; then
            static_cxx_archive="$(find / -name 'libstdc++.a' -type f -print -quit 2>/dev/null)"
          fi
          test -n "$static_cxx_archive" && test -f "$static_cxx_archive"
          echo "using static C++ archive: $static_cxx_archive"
          ln -s "$static_cxx_archive" "$static_cxx/libstdc++.so"
          export RUSTFLAGS="-L native=$static_cxx"
          cargo build --release --locked --all-features --bin actus
          ldd target/release/actus
          ! ldd target/release/actus | grep -q libstdc++
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          python3 scripts/release/package_user_archive.py --repository-root "$GITHUB_WORKSPACE" --prefix "$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2" --build-root "$GITHUB_WORKSPACE/target/release/build" --target x86_64-unknown-linux-gnu --version "$version" --output-dir "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-support-x86_64-unknown-linux-gnu
          path: release-support/

  build-macos:
    name: Build user archive (macOS arm64)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Bootstrap bundled LLVM
        shell: bash
        run: scripts/bootstrap_llvm.sh
      - name: Build ARM verification startup object
        shell: bash
        run: |
          mkdir -p release-support
          .actus-toolchain/llvm-23.1.2/bin/llc -mtriple=thumbv7em-none-eabihf -mcpu=cortex-m7 -filetype=obj scripts/release/user_archive_startup.ll -o release-support/startup.o
      - name: Build and package
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          CARGO_PROFILE_RELEASE_DEBUG: "2"
        run: |
          set -euo pipefail
          cargo build --release --locked --all-features --bin actus
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          python3 scripts/release/package_user_archive.py --repository-root "$GITHUB_WORKSPACE" --prefix "$GITHUB_WORKSPACE/.actus-toolchain/llvm-23.1.2" --build-root "$GITHUB_WORKSPACE/target/release/build" --target aarch64-apple-darwin --version "$version" --output-dir "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aarch64-apple-darwin
          path: release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-support-aarch64-apple-darwin
          path: release-support/

  build-windows:
    name: Build user archive (Windows x86-64)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Validate tag version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "tag must be v$version, got $env:GITHUB_REF_NAME" }
      - name: Bootstrap bundled LLVM
        shell: pwsh
        run: ./scripts/bootstrap_llvm.ps1
      - name: Build ARM verification startup object
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-support | Out-Null
          & "$env:GITHUB_WORKSPACE\.actus-toolchain\llvm-23.1.2\bin\llc.exe" -mtriple=thumbv7em-none-eabihf -mcpu=cortex-m7 -filetype=obj scripts/release/user_archive_startup.ll -o release-support/startup.o
      - name: Build and package
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "2"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --all-features --bin actus
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $redistVersion = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redistVersion) { throw 'no numeric VC redist version directory found' }
          $vcRoot = Join-Path $redistVersion.FullName 'x64\Microsoft.VC143.CRT'
          python scripts/release/package_user_archive.py --repository-root $env:GITHUB_WORKSPACE --prefix "$env:GITHUB_WORKSPACE\.actus-toolchain\llvm-23.1.2" --build-root "$env:GITHUB_WORKSPACE\target\release\build" --target x86_64-pc-windows-msvc --version $version --output-dir "$env:GITHUB_WORKSPACE\release" --vc-redist-root $vcRoot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-x86_64-pc-windows-msvc
          path: release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-support-x86_64-pc-windows-msvc
          path: release-support/

  verify:
    name: Verify user archive (${{ matrix.target }})
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.target }}
          path: incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verify-support-${{ matrix.target }}
          path: support
      - name: Install QEMU for Linux archive verification
        if: runner.os == 'Linux'
        run: sudo apt-get -o DPkg::Lock::Timeout=300 update && sudo apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends -y qemu-system-arm
      - name: Verify extracted archive
        run: |
          python scripts/release/verify_user_archive.py --incoming incoming --support support --target '${{ matrix.target }}'

  assemble:
    name: Assemble release assets
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: assets/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-aarch64-apple-darwin
          path: assets/aarch64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x86_64-pc-windows-msvc
          path: assets/x86_64-pc-windows-msvc
      - name: Assemble and validate six final assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          cp assets/x86_64-unknown-linux-gnu/*.tar.xz assets/x86_64-unknown-linux-gnu/*.debug release-assets/
          cp assets/x86_64-pc-windows-msvc/*.zip assets/x86_64-pc-windows-msvc/*.pdb release-assets/
          mapfile -t mac_archives < <(find assets/aarch64-apple-darwin -maxdepth 1 -type f -name '*.tar.xz')
          test "${#mac_archives[@]}" -eq 1 || { echo "expected one macOS archive, found: ${mac_archives[*]}" >&2; exit 1; }
          mapfile -t mac_dsyms < <(find assets/aarch64-apple-darwin -maxdepth 1 -type d -name '*.dSYM')
          test "${#mac_dsyms[@]}" -eq 1 || { echo "expected one macOS dSYM, found: ${mac_dsyms[*]}" >&2; exit 1; }
          cp "${mac_archives[0]}" release-assets/
          python3 scripts/llvm/package_archive.py \
            --input-root "${mac_dsyms[0]}" \
            --output "release-assets/$(basename "${mac_dsyms[0]}").zip" \
            --format zip \
            --top-level-dir "$(basename "${mac_dsyms[0]}")" \
            --manifest ''
          find release-assets -maxdepth 1 -type f -name '*.sha256' -delete
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( \
            -name '*.tar.xz' -o -name '*.zip' -o -name '*.debug' -o -name '*.dSYM.zip' -o -name '*.pdb' \
          \) -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 6
          (cd release-assets && sha256sum "${assets[@]}" > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 6
          ! grep -q 'release-assets/' release-assets/SHA256SUMS
          printf 'final assets:\n%s\n' "${assets[*]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets

  publish:
    name: Publish Actus release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish only archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release already exists: $GITHUB_REF_NAME" >&2; exit 1; fi
          args=(--title "Actus $GITHUB_REF_NAME" --generate-notes); case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* "${args[@]}"
