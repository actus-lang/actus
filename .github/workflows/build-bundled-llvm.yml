name: Build bundled LLVM development archive

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.2
  LLVM_SOURCE_REVISION: 85ac560262434c9ccfc0c183ec22d4138ed647fb
  ACTUS_GLIBC_IMAGE_DIGEST: sha256:9756efb8fb8476b5318596892edaab48562e5984cfbcba98a07216664d7f5981
  CCACHE_DIR: /root/.cache/ccache

jobs:
  build-linux-x86_64:
    name: Build LLVM 23.1.2 (Linux x86-64, glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9756efb8fb8476b5318596892edaab48562e5984cfbcba98a07216664d7f5981
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y ccache cmake git ninja-build python3 tar xz
          else
            yum install -y ccache cmake git ninja-build python3 tar xz
          fi
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.cache/ccache
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Configure LLVM without building
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Build and package after successful configure
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz.sha256
          if-no-files-found: error

  verify-linux-x86_64:
    name: Verify LLVM development archive (Linux x86-64, glibc 2.28)
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9756efb8fb8476b5318596892edaab48562e5984cfbcba98a07216664d7f5981
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify archive in a clean container
        shell: bash
        run: |
          set -euo pipefail
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'
          ./scripts/verify_llvm_dev_linux.sh
