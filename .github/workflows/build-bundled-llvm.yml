name: Build bundled LLVM development archive

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified archives as a prerelease
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag; use a new actus-N value for a new release
        required: true
        type: string
        default: llvm-23.1.2-actus-1
  push:
    branches:
      - main
    paths:
      - 'toolchains/llvm/**'
      - 'scripts/build_llvm_dev_linux.sh'
      - 'scripts/verify_llvm_dev_linux.sh'
      - 'scripts/build_llvm_dev_macos.sh'
      - 'scripts/verify_llvm_dev_macos.sh'
      - 'scripts/build_llvm_dev_windows.ps1'
      - 'scripts/verify_llvm_dev_windows.ps1'
      - 'scripts/llvm/**'
      - 'tests/toolchain/**'
      - '.github/workflows/build-bundled-llvm.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'toolchains/llvm/**'
      - 'scripts/build_llvm_dev_linux.sh'
      - 'scripts/verify_llvm_dev_linux.sh'
      - 'scripts/build_llvm_dev_macos.sh'
      - 'scripts/verify_llvm_dev_macos.sh'
      - 'scripts/build_llvm_dev_windows.ps1'
      - 'scripts/verify_llvm_dev_windows.ps1'
      - 'scripts/llvm/package_archive.py'
      - 'scripts/llvm/**'
      - 'tests/toolchain/**'
      - '.github/workflows/build-bundled-llvm.yml'

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.2
  LLVM_SOURCE_REVISION: 85ac560262434c9ccfc0c183ec22d4138ed647fb
  ACTUS_GLIBC_IMAGE_DIGEST: sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
  CCACHE_DIR: /root/.cache/ccache

jobs:
  test-builtin-resolvers:
    name: Test compiler-rt builtin resolvers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Bash resolver
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/llvm/test_resolvers.sh

      - name: Test PowerShell resolver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/llvm/test_resolver_windows.ps1

  build-linux-x86_64:
    name: Build LLVM 23.1.2 (Linux x86-64, glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y ccache cmake git make python3 tar xz
          else
            yum install -y ccache cmake git make python3 tar xz
          fi
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.cache/ccache
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Configure LLVM without building
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Build and package after successful configure
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.cache/ccache
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz.sha256
          if-no-files-found: error

  verify-linux-x86_64:
    name: Verify LLVM development archive (Linux x86-64, glibc 2.28)
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify archive in a clean container
        shell: bash
        run: |
          set -euo pipefail
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'
          ./scripts/verify_llvm_dev_linux.sh

  build-macos-arm64:
    name: Build LLVM 23.1.2 (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew list ccache >/dev/null 2>&1 || brew install ccache
          for command_name in git cmake ninja ccache python3 xcodebuild xcrun shasum; do
            command -v "${command_name}"
          done

      - name: Set up pinned macOS Bash
        shell: bash
        run: |
          set -euo pipefail
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /opt/homebrew/bin/bash --version | head -n 1

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: llvm-macos-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-macos-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure ccache
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          set -euo pipefail
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Configure LLVM without building
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: /opt/homebrew/bin/ccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CCACHE_DIR: ${{ runner.temp }}/ccache
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          ACTUS_MACOS_RUNNER_IMAGE: macos-15
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log
        run: bash ./scripts/build_llvm_dev_macos.sh

      - name: Build and package after successful configure
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: /opt/homebrew/bin/ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CCACHE_DIR: ${{ runner.temp }}/ccache
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          ACTUS_MACOS_RUNNER_IMAGE: macos-15
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log
        run: bash ./scripts/build_llvm_dev_macos.sh

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: llvm-macos-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin.tar.xz
            dist/llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin.tar.xz.sha256
          if-no-files-found: error

  verify-macos-arm64:
    name: Verify LLVM development archive (macOS arm64)
    needs: build-macos-arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin
          path: dist

      - name: Set up pinned macOS Bash
        shell: bash
        run: |
          set -euo pipefail
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /opt/homebrew/bin/bash --version | head -n 1

      - name: Verify archive with archive-prefix checks
        shell: /opt/homebrew/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: ./scripts/verify_llvm_dev_macos.sh

  build-windows-x86_64:
    name: Build LLVM 23.1.2 (Windows x86-64, MSVC /MD)
    runs-on: windows-2022
    timeout-minutes: 340
    env:
      ACTUS_MSVC_TOOLSET_VERSION: 14.44.35207
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned MSVC toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC installation was not found' }
          $vcvars = Join-Path $vsPath 'VC/Auxiliary/Build/vcvars64.bat'
          $environment = cmd /s /c "`"$vcvars`" amd64 -vcvars_ver=14.44 && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              Set-Item -Path "Env:$($Matches[1])" -Value $Matches[2]
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
          if ($env:VCToolsVersion -ne $env:ACTUS_MSVC_TOOLSET_VERSION) {
            throw "expected MSVC toolset $env:ACTUS_MSVC_TOOLSET_VERSION, got $env:VCToolsVersion"
          }
          cl.exe 2>&1 | Select-Object -First 1

      - name: Install build tools
        shell: pwsh
        run: |
          choco install ninja sccache --no-progress --yes
          foreach ($commandName in @('git', 'cmake', 'ninja', 'sccache', 'python', 'dumpbin')) {
            Get-Command $commandName
          }

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sccache
          key: llvm-windows-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-windows-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: |
          sccache --zero-stats

      - name: Configure LLVM without building
        shell: pwsh
        env:
          ACTUS_CMAKE_LAUNCHER: sccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: ./scripts/build_llvm_dev_windows.ps1

      - name: Build and package after successful configure
        shell: pwsh
        env:
          ACTUS_CMAKE_LAUNCHER: sccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: ./scripts/build_llvm_dev_windows.ps1

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sccache
          key: llvm-windows-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.zip
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  verify-windows-x86_64:
    name: Verify LLVM development archive (Windows x86-64, MSVC /MD)
    needs: build-windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ACTUS_MSVC_TOOLSET_VERSION: 14.44.35207
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned MSVC toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath 'VC/Auxiliary/Build/vcvars64.bat'
          $environment = cmd /s /c "`"$vcvars`" amd64 -vcvars_ver=14.44 && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              Set-Item -Path "Env:$($Matches[1])" -Value $Matches[2]
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
          if ($env:VCToolsVersion -ne $env:ACTUS_MSVC_TOOLSET_VERSION) {
            throw "expected MSVC toolset $env:ACTUS_MSVC_TOOLSET_VERSION, got $env:VCToolsVersion"
          }

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc
          path: dist

      - name: Verify archive with archive-prefix checks
        shell: pwsh
        run: ./scripts/verify_llvm_dev_windows.ps1

  publish:
    name: Publish LLVM development archives
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs:
      - verify-linux-x86_64
      - verify-macos-arm64
      - verify-windows-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: release-assets

      - name: Download macOS archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin
          path: release-assets

      - name: Download Windows archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc
          path: release-assets

      - name: Validate release assets and create manifest
        shell: bash
        env:
          ACTUS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          tag = os.environ["ACTUS_RELEASE_TAG"]
          if tag != "llvm-23.1.2-actus-1" and not tag.startswith("llvm-23.1.2-actus-"):
              raise SystemExit(f"invalid LLVM release tag: {tag}")
          manifest_path = Path("toolchains/llvm/llvm-23.1.2.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = {}
          for triple, record in manifest["archives"].items():
              archive = Path("release-assets") / record["file"]
              if not archive.is_file():
                  raise SystemExit(f"release asset is missing: {archive}")
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              size = archive.stat().st_size
              if archive.suffix == ".zip":
                  with zipfile.ZipFile(archive) as archive_file:
                      names = archive_file.namelist()
                      contents = {
                          name[2:] if name.startswith("./") else name: archive_file.read(name)
                          for name in names
                          if name in {"licenses/LLVM-LICENSE.TXT", "./licenses/LLVM-LICENSE.TXT",
                                      "licenses/THIRD-PARTY-NOTICES.txt", "./licenses/THIRD-PARTY-NOTICES.txt"}
                      }
              else:
                  with tarfile.open(archive, "r:*") as archive_file:
                      members = archive_file.getmembers()
                      names = [member.name for member in members]
                      contents = {}
                      for member in members:
                          normalized_name = member.name[2:] if member.name.startswith("./") else member.name
                          if normalized_name in {"licenses/LLVM-LICENSE.TXT", "licenses/THIRD-PARTY-NOTICES.txt"}:
                              extracted = archive_file.extractfile(member)
                              contents[normalized_name] = extracted.read() if extracted else b""
              normalized_names = {name[2:] if name.startswith("./") else name for name in names}
              license_names = [name for name in normalized_names if name.startswith("licenses/")]
              required = {"licenses/LLVM-LICENSE.TXT", "licenses/THIRD-PARTY-NOTICES.txt"}
              if not required.issubset(license_names):
                  raise SystemExit(f"license files are missing from {archive}: {sorted(required - set(license_names))}")
              for license_name in required:
                  if not contents.get(license_name, b"").strip():
                      raise SystemExit(f"license file is empty in {archive}: {license_name}")
              if b"Apache" not in contents["licenses/LLVM-LICENSE.TXT"]:
                  raise SystemExit(f"LLVM license text is not Apache-licensed in {archive}")
              record = dict(record)
              record["release_url"] = f"https://github.com/actus-lang/actus/releases/download/{tag}/{record['file']}"
              record["size"] = size
              record["sha256"] = digest
              records[triple] = record
          manifest["release_tag"] = tag
          manifest["archives"] = records
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          description = Path("release-description.md")
          lines = [
              "This is not an Actus release.",
              "",
              "This prerelease contains the pinned LLVM 23.1.2 development toolchain used to build Actus from source.",
              "Install it with `scripts/bootstrap_llvm.sh` or `scripts/bootstrap_llvm.ps1`.",
              "",
              "Architecture and provenance: [ADR-0105](https://github.com/actus-lang/actus/blob/main/docs/decisions/ADR-0105-bundled-llvm-and-lld-toolchain.md).",
              "",
              "SHA-256:",
          ]
          for triple, record in records.items():
              lines.append(f"- `{record['file']}` ({triple}): `{record['sha256']}`")
          description.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${ACTUS_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release tag already exists: ${ACTUS_RELEASE_TAG}" >&2
            exit 1
          fi
          if gh release view "${ACTUS_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release already exists: ${ACTUS_RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Create prerelease and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "${ACTUS_RELEASE_TAG}" \
            release-assets/*.tar.xz release-assets/*.zip \
            release-assets/*.sha256 toolchains/llvm/llvm-23.1.2.json \
            --title "LLVM 23.1.2 development toolchain (${ACTUS_RELEASE_TAG##*-})" \
            --notes-file release-description.md \
            --prerelease --latest=false

      - name: Record published manifest on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add toolchains/llvm/llvm-23.1.2.json
          git commit -m "ci(llvm): record published toolchain ${ACTUS_RELEASE_TAG}" || exit 0
          git push origin HEAD:main
