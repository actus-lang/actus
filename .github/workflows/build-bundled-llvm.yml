name: Build bundled LLVM development archive

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'toolchains/llvm/**'
      - 'scripts/build_llvm_dev_linux.sh'
      - 'scripts/verify_llvm_dev_linux.sh'
      - 'scripts/build_llvm_dev_macos.sh'
      - 'scripts/verify_llvm_dev_macos.sh'
      - 'scripts/llvm/package_archive.py'
      - 'tests/toolchain/**'
      - '.github/workflows/build-bundled-llvm.yml'

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.2
  LLVM_SOURCE_REVISION: 85ac560262434c9ccfc0c183ec22d4138ed647fb
  ACTUS_GLIBC_IMAGE_DIGEST: sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
  CCACHE_DIR: /root/.cache/ccache

jobs:
  build-linux-x86_64:
    name: Build LLVM 23.1.2 (Linux x86-64, glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y ccache cmake git make python3 tar xz
          else
            yum install -y ccache cmake git make python3 tar xz
          fi
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.cache/ccache
          key: llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Configure LLVM without building
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Build and package after successful configure
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./scripts/build_llvm_dev_linux.sh

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz
            dist/llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu.tar.xz.sha256
          if-no-files-found: error

  verify-linux-x86_64:
    name: Verify LLVM development archive (Linux x86-64, glibc 2.28)
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify archive in a clean container
        shell: bash
        run: |
          set -euo pipefail
          test "$(ldd --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+$')" = '2.28'
          ./scripts/verify_llvm_dev_linux.sh

  build-macos-arm64:
    name: Build LLVM 23.1.2 (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache
          for command_name in git cmake ninja ccache python3 xcodebuild xcrun shasum; do
            command -v "${command_name}"
          done

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: llvm-macos-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-${{ github.run_id }}
          restore-keys: |
            llvm-macos-${{ env.LLVM_VERSION }}-${{ env.LLVM_SOURCE_REVISION }}-

      - name: Configure ccache
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          set -euo pipefail
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Configure LLVM without building
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          ACTUS_LLVM_CONFIGURE_ONLY: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CCACHE_DIR: ${{ runner.temp }}/ccache
          MACOSX_DEPLOYMENT_TARGET: 13.0
          ACTUS_MACOS_RUNNER_IMAGE: macos-15
        run: bash ./scripts/build_llvm_dev_macos.sh

      - name: Build and package after successful configure
        shell: bash
        env:
          ACTUS_CMAKE_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CCACHE_DIR: ${{ runner.temp }}/ccache
          MACOSX_DEPLOYMENT_TARGET: 13.0
          ACTUS_MACOS_RUNNER_IMAGE: macos-15
        run: bash ./scripts/build_llvm_dev_macos.sh

      - name: Upload development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin
          path: |
            dist/llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin.tar.xz
            dist/llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin.tar.xz.sha256
          if-no-files-found: error

  verify-macos-arm64:
    name: Verify LLVM development archive (macOS arm64)
    needs: build-macos-arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'

      - name: Download development archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llvm-dev-${{ env.LLVM_VERSION }}-aarch64-apple-darwin
          path: dist

      - name: Verify archive with archive-prefix checks
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: 13.0
        run: bash ./scripts/verify_llvm_dev_macos.sh
